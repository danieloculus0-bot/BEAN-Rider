[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bean-rider"
version = "0.3.0"
description = "BEAN-Rider automotive engine intelligence, read-only OBD and calibration workbench"
requires-python = ">=3.10"
license = {text = "Proprietary - license not granted"}

[tool.setuptools.packages.find]
where = ["."]
include = ["bean_rider*"]

[project.optional-dependencies]
obd = ["python-OBD>=0.7"]
